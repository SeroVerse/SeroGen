[project]
name = "serogen"
version = "0.1.0"
description = "Genomic analysis for in silico serotyping"
readme = "README.md"
authors = [
    { name = "Tom Stanton", email = "tomdstanton@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
docs = [
    "mkdocstrings[python]>=1.0.7",
    "zensical>=0.0.70",
    "zenzic>=0.30.0",
]
lint = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]
test = [
    "pytest>=9.1.1",
]
typing = [
    "ty>=0.0.86",
]
