[project]
site_url = "https://SeroVerse.github.io/serogen/"
site_name = "SeroGen"
site_description = "High-performance genomic analysis, de novo polysaccharide locus segmentation, and in silico serotyping"
site_author = "Tom Stanton"
copyright = "Copyright &copy; 2026 Tom Stanton — SeroVerse"

repo_url = "https://github.com/SeroVerse/serogen"
repo_name = "SeroVerse/serogen"
edit_uri = "edit/main/docs/"

nav = [
  { "Overview" = [
    { "Home" = "index.md" },
    { "Architecture & Algorithms" = "architecture.md" },
  ] },
  { "API Reference" = [
    { "Overview" = "reference/index.md" },
    { "serogen.core" = "reference/core.md" },
    { "serogen.genes" = "reference/genes.md" },
    { "serogen.loci" = "reference/loci.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/dna"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/SeroVerse/serogen"
name = "SeroVerse/serogen on GitHub"

[project.plugins.search]
enabled = true

[project.plugins.autorefs]
enabled = true

[project.plugins.gh-admonitions]
enabled = true

[project.plugins.glightbox]
enabled = true

[project.plugins.llmstxt]
enabled = true
markdown_description = "SeroGen: High-performance genomic analysis, single-pass bacterial & prophage ORF prediction, deep CNN functional role classification, exact ACP-DP locus segmentation, and bipartite graph alignment for in silico serotyping."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Overview & Architecture" = [
  { "index.md" = "Getting started, quickstart, and performance benchmarks" },
  { "architecture.md" = "Structure-of-Arrays (SoA) core, single-pass HMM-Viterbi ORF caller, CNN role classifier, and ACP-DP locus segmentation" },
]
"API Reference" = [
  { "reference/core.md" = "serogen.core: SoA containers, sequences, alphabets, randstrobe indices, SW-Gotoh alignment, clustering, and graphs" },
  { "reference/genes.md" = "serogen.genes: OrfPredictor, GeneRoleClassifier, GeneRoles, and Genes containers" },
  { "reference/loci.md" = "serogen.loci: LocusSegmenter, LocusMatcher, LocusDatabase, and Locus/Loci models" },
]

[project.plugins.mkdocstrings]
enabled = true
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
group_by_category = true
summary = true
inherited_members = false
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
